<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大マヨネーズ銀河帝国 統合通信HUB</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (v10) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      // Firebase設定 (リアルタイムチャット用)
      const firebaseConfig = {
        apiKey: "AIzaSyA7vZoOms_DIZpXiIAbrHRRLoo1uQ2eDbA",
        authDomain: "mayo-chat.firebaseapp.com",
        databaseURL: "https://mayo-chat-default-rtdb.firebaseio.com",
        projectId: "mayo-chat",
        storageBucket: "mayo-chat.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:xxxx"
      };

      try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        window.sendFirebaseMessage = function(data) {
          push(messagesRef, data);
        };

        onChildAdded(messagesRef, (snapshot) => {
          const msg = snapshot.val();
          if (window.appendMessageToUI) {
            window.appendMessageToUI(msg);
          }
        });
      } catch (e) {
        console.warn("Firebase初期化待機中:", e);
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap');
        body { font-family: 'Zen Kaku Gothic New', sans-serif; background-color: #0f1115; color: #e2e8f0; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: #111827; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-yellow-400 rounded-lg flex items-center justify-center text-black font-black text-xl shadow-lg shadow-yellow-500/20">マ</div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="font-bold text-white tracking-wide">大マヨネーズ銀河帝国</h1>
                    <span class="text-xs bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-0.5 rounded font-mono">Gemini AI / 全端末同期中</span>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="openProfileModal()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center space-x-1 shadow">
                <i class="fa-solid fa-id-card"></i>
                <span>身分証・API設定</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-gray-900/95 border-r border-gray-800 flex flex-col shrink-0">
            <div class="p-3 text-xs font-bold text-gray-400 uppercase tracking-wider">通信チャンネル</div>
            <div class="flex-1 overflow-y-auto px-2 space-y-1">
                <button onclick="switchChannel('general')" id="chan-general" class="chan-btn w-full text-left px-2.5 py-2 rounded-lg text-sm font-medium text-yellow-400 bg-yellow-500/10 border border-yellow-500/20">
                    <i class="fa-solid fa-hashtag text-gray-400 mr-2"></i>マヨラー雑談処
                </button>
                <button onclick="switchChannel('yorozuya')" id="chan-yorozuya" class="chan-btn w-full text-left px-2.5 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800">
                    <i class="fa-solid fa-hashtag text-gray-400 mr-2"></i>万事屋連絡網
                </button>
                <button onclick="switchChannel('tavern')" id="chan-tavern" class="chan-btn w-full text-left px-2.5 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800">
                    <i class="fa-solid fa-hashtag text-gray-400 mr-2"></i>居酒屋「縁側」
                </button>
            </div>

            <!-- Profile Footer -->
            <div class="p-3 bg-gray-950 border-t border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-2 overflow-hidden">
                    <div id="user-avatar-preview" class="w-8 h-8 rounded-full bg-yellow-500 text-black flex items-center justify-center font-bold text-sm shrink-0">覇</div>
                    <div class="truncate">
                        <div id="user-name-display" class="text-xs font-bold text-white truncate">覇王 (Player)</div>
                        <div id="user-title-display" class="text-[10px] text-gray-400 truncate">特命マヨ監察官</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col bg-gray-950 relative overflow-hidden">
            <!-- Messages List -->
            <div id="chat-stream" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll"></div>

            <!-- Attached File Preview -->
            <div id="attachment-preview" class="hidden px-4 py-2 bg-gray-900 border-t border-gray-800 flex items-center justify-between text-xs text-yellow-400">
                <span id="attachment-name"><i class="fa-solid fa-paperclip mr-1"></i> 添付ファイル</span>
                <button onclick="clearAttachment()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Chat Input Bar -->
            <div class="p-3 bg-gray-900 border-t border-gray-800 shrink-0">
                <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2">
                    <label class="cursor-pointer p-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg border border-gray-700">
                        <i class="fa-solid fa-paperclip"></i>
                        <input type="file" id="file-input" onchange="handleFileSelect(event)" class="hidden">
                    </label>
                    <input type="text" id="message-input" autocomplete="off" placeholder="メッセージを送信... (例: @土方 @銀時 こんにちは)" 
                        class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                    <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-5 py-2 rounded-lg text-sm shrink-0">
                        送信
                    </button>
                </form>
            </div>
        </main>

        <!-- Right Roster Sidebar -->
        <aside class="w-60 bg-gray-900 border-l border-gray-800 flex flex-col shrink-0">
            <div class="p-3 text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-800 flex items-center justify-between">
                <span>オンライン隊員</span>
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2 text-xs">
                <!-- User Profile Card -->
                <div class="p-2 bg-gray-800/80 rounded border border-gray-700/80 flex items-center space-x-2">
                    <div class="relative">
                        <div id="roster-user-avatar" class="w-7 h-7 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs">覇</div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border border-gray-900"></span>
                    </div>
                    <div class="truncate">
                        <div id="roster-user-name" class="font-bold text-white truncate">覇王</div>
                        <div class="text-[9px] text-gray-400">あなた</div>
                    </div>
                </div>

                <!-- AI Members -->
                <div class="p-2 bg-gray-800/50 rounded border border-gray-800 flex items-center space-x-2">
                    <div class="relative">
                        <div class="w-7 h-7 rounded-full bg-red-700 text-white font-bold flex items-center justify-center text-xs">土</div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border border-gray-900"></span>
                    </div>
                    <div>
                        <div class="font-bold text-red-400">土方十四郎 (@土方)</div>
                        <div class="text-[9px] text-gray-400">マヨネーズ最高指導者</div>
                    </div>
                </div>

                <div class="p-2 bg-gray-800/50 rounded border border-gray-800 flex items-center space-x-2">
                    <div class="relative">
                        <div class="w-7 h-7 rounded-full bg-blue-700 text-white font-bold flex items-center justify-center text-xs">銀</div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border border-gray-900"></span>
                    </div>
                    <div>
                        <div class="font-bold text-blue-400">坂田銀時 (@銀時)</div>
                        <div class="text-[9px] text-gray-400">万事屋参謀・甘党</div>
                    </div>
                </div>

                <div class="p-2 bg-gray-800/50 rounded border border-gray-800 flex items-center space-x-2">
                    <div class="relative">
                        <div class="w-7 h-7 rounded-full bg-red-900 text-white font-bold flex items-center justify-center text-xs">沖</div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border border-gray-900"></span>
                    </div>
                    <div>
                        <div class="font-bold text-red-300">沖田総悟 (@沖田)</div>
                        <div class="text-[9px] text-gray-400">サディスティック隊長</div>
                    </div>
                </div>

                <div class="p-2 bg-gray-800/50 rounded border border-gray-800 flex items-center space-x-2">
                    <div class="relative">
                        <div class="w-7 h-7 rounded-full bg-orange-600 text-white font-bold flex items-center justify-center text-xs">神</div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border border-gray-900"></span>
                    </div>
                    <div>
                        <div class="font-bold text-orange-400">神楽 (@神楽)</div>
                        <div class="text-[9px] text-gray-400">夜兎族アタッカー</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal Profile & API Key -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-xl max-w-md w-full p-5 space-y-4">
            <h3 class="font-bold text-white text-base">身分証 & Gemini API 設定</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">名前</label>
                    <input type="text" id="profile-name-input" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white font-bold">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">アイコン一文字</label>
                    <input type="text" id="profile-avatar-input" maxlength="2" class="w-20 bg-gray-950 border border-gray-700 rounded p-2 text-center text-white font-bold">
                </div>
                <div class="pt-2 border-t border-gray-800">
                    <label class="block text-yellow-400 font-bold mb-1"><i class="fa-solid fa-key mr-1"></i> Gemini APIキー</label>
                    <input type="password" id="profile-key-input" placeholder="AQ.Ab8RN6..." class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white font-mono text-xs">
                    <p class="text-[10px] text-gray-500 mt-1">※キーはブラウザに安全に保存され、GitHub側で遮断されるのを防ぎます。</p>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-3">
                <button onclick="closeProfileModal()" class="px-3 py-1.5 bg-gray-800 text-gray-300 rounded text-xs">閉じる</button>
                <button onclick="saveProfile()" class="px-4 py-1.5 bg-yellow-500 text-black rounded text-xs font-bold">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('mayo_user')) || { name: '覇王 (Player)', title: '特命マヨ監察官', avatar: '覇', geminiKey: '' };
        let attachedFile = null;
        let currentChannel = 'general';

        window.addEventListener('DOMContentLoaded', () => { updateProfileUI(); });

        function switchChannel(chan) {
            currentChannel = chan;
            document.querySelectorAll('.chan-btn').forEach(b => {
                b.classList.remove('text-yellow-400', 'bg-yellow-500/10', 'border', 'border-yellow-500/20');
                b.classList.add('text-gray-400');
            });
            const btn = document.getElementById(`chan-${chan}`);
            if (btn) btn.classList.add('text-yellow-400', 'bg-yellow-500/10', 'border', 'border-yellow-500/20');
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                attachedFile = { name: file.name, type: file.type, data: evt.target.result };
                document.getElementById('attachment-name').innerText = `📎 ${file.name}`;
                document.getElementById('attachment-preview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('attachment-preview').classList.hidden = true;
            document.getElementById('attachment-preview').classList.add('hidden');
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !attachedFile) return;

            const msgData = {
                userName: currentUser.name,
                userAvatar: currentUser.avatar,
                text: text,
                file: attachedFile,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            if (window.sendFirebaseMessage) {
                window.sendFirebaseMessage(msgData);
            } else {
                window.appendMessageToUI(msgData);
            }

            input.value = '';
            clearAttachment();

            // AIキャラ応答チェック
            checkAIResponse(text);
        }

        async function checkAIResponse(userText) {
            const charaConfigs = [
                { keyword: '土方', name: '土方十四郎', avatar: '土', prompt: 'あなたは銀魂の土方十四郎です。マヨネーズをこよなく愛し、少し荒っぽいですが筋の通った口調で短く返答してください。' },
                { keyword: '銀時', name: '坂田銀時', avatar: '銀', prompt: 'あなたは銀魂の坂田銀時です。やる気のないだるそうな口調で、甘党やパフェの話を交えつつ短く返答してください。' },
                { keyword: '沖田', name: '沖田総悟', avatar: '沖', prompt: 'あなたは銀魂の沖田総悟です。語尾に「〜でさぁ」をつけ、土方への嫌がらせやサディスティックな発言を含めて短く返答してください。' },
                { keyword: '神楽', name: '神楽', avatar: '神', prompt: 'あなたは銀魂の神楽です。語尾に「〜アル」「〜ネ」をつけ、酢昆布や食い気満々の元気な口調で短く返答してください。' }
            ];

            for (const c of charaConfigs) {
                if (userText.includes(c.keyword) || userText.includes(`@${c.keyword}`)) {
                    setTimeout(async () => {
                        const replyText = await fetchGeminiReply(c.prompt, userText);
                        const aiMsg = {
                            userName: c.name,
                            userAvatar: c.avatar,
                            text: replyText,
                            isAI: true,
                            timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        };
                        if (window.sendFirebaseMessage) window.sendFirebaseMessage(aiMsg);
                        else window.appendMessageToUI(aiMsg);
                    }, 1000);
                    break;
                }
            }
        }

        async function fetchGeminiReply(systemPrompt, userQuery) {
            const apiKey = currentUser.geminiKey;
            if (!apiKey) {
                return '……（APIキーが未設定だ。右上の「身分証＆API設定」からGemini APIキーを入力してくれ）';
            }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemPrompt}\n\nユーザーのメッセージ: "${userQuery}"` }] }]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0]) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return '……（APIキーが無効か、通信レスポンスを取得できなかったようだ）';
                }
            } catch (err) {
                return '……（通信エラーが発生したようだ）';
            }
        }

        window.appendMessageToUI = function(m) {
            const container = document.getElementById('chat-stream');
            if (!container) return;

            const isMe = m.userName === currentUser.name;
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start space-x-3 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}`;

            let fileHTML = '';
            if (m.file) {
                if (m.file.type.startsWith('image/')) {
                    fileHTML = `<img src="${m.file.data}" class="mt-2 max-h-48 rounded border border-gray-700">`;
                } else if (m.file.type.startsWith('audio/')) {
                    fileHTML = `<audio controls src="${m.file.data}" class="mt-2 w-full"></audio>`;
                } else {
                    fileHTML = `<a href="${m.file.data}" download="${m.file.name}" class="mt-2 block p-2 bg-gray-900 border border-gray-700 rounded text-xs text-yellow-400">💾 ${m.file.name} (ダウンロード)</a>`;
                }
            }

            msgDiv.innerHTML = `
                <div class="w-9 h-9 rounded-full ${m.isAI ? 'bg-red-700 text-white' : (isMe ? 'bg-yellow-500 text-black' : 'bg-gray-700 text-white')} flex items-center justify-center font-bold text-sm shrink-0 shadow">
                    ${m.userAvatar || '名'}
                </div>
                <div class="max-w-xl ${isMe ? 'items-end' : 'items-start'} flex flex-col">
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="text-xs font-bold text-gray-300">${m.userName}</span>
                        <span class="text-[10px] text-gray-600">${m.timestamp}</span>
                    </div>
                    <div class="p-3 rounded-2xl text-sm ${isMe ? 'bg-yellow-500 text-black font-medium' : 'bg-gray-800 text-gray-100 border border-gray-700/60'} shadow-md">
                        <div>${m.text}</div>
                        ${fileHTML}
                    </div>
                </div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        };

        function updateProfileUI() {
            document.getElementById('user-name-display').innerText = currentUser.name;
            document.getElementById('user-avatar-preview').innerText = currentUser.avatar;
            document.getElementById('roster-user-name').innerText = currentUser.name;
            document.getElementById('roster-user-avatar').innerText = currentUser.avatar;
        }

        function openProfileModal() {
            document.getElementById('profile-name-input').value = currentUser.name;
            document.getElementById('profile-avatar-input').value = currentUser.avatar;
            document.getElementById('profile-key-input').value = currentUser.geminiKey || '';
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function saveProfile() {
            currentUser.name = document.getElementById('profile-name-input').value || '覇王';
            currentUser.avatar = document.getElementById('profile-avatar-input').value || '覇';
            currentUser.geminiKey = document.getElementById('profile-key-input').value.trim();
            localStorage.setItem('mayo_user', JSON.stringify(currentUser));
            updateProfileUI();
            closeProfileModal();
        }
    </script>
</body>
</html>
