                            hover: '#283644',

                        <button type="button" onclick="insertQuickText('沖田、バズーカを構えろ')" class="bg-samurai-cardBg hover:bg-samurai-hover text-mayo-300 px-2 py-0.5 rounded border border-samurai-border shrink-0">沖田！</button>
                        <button type="button" onclick="insertQuickText('近藤局長、ムラムラします')" class="bg-samurai-cardBg hover:bg-samurai-hover text-mayo-300 px-2 py-0.5 rounded border border-samurai-border shrink-0">近藤局長！</button>
                        <button type="button" onclick="insertQuickText('隊員の皆さん、こんにちは！')" class="bg-samurai-cardBg hover:bg-samurai-hover text-mayo-300 px-2 py-0.5 rounded border border-samurai-border shrink-0">挨拶</button>

        <!-- 3. RIGHT SIDEBAR: REAL-TIME ONLINE MEMBERS ROSTER -->

            <button onclick="toggleCitizenCardModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg">

            <!-- Card Header -->
            <div class="text-center border-b border-mayo-500/30 pb-4 mb-4">
                <div class="inline-block bg-mayo-500 text-samurai-dark font-black text-[10px] px-3 py-0.5 rounded-full uppercase tracking-widest mb-1">
                    GREAT MAYONNAISE GALACTIC EMPIRE

            <!-- Profile Settings Form -->
            <div class="space-y-4 mb-5">

                    <label class="block text-xs font-bold text-mayo-300 mb-1">表示名 (ユーザー名)</label>
                    <input type="text" id="inputUserName" class="w-full bg-samurai-dark border border-samurai-border rounded-lg p-2.5 text-sm text-white focus:border-mayo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-mayo-300 mb-1">役職・肩書き</label>
                    <input type="text" id="inputUserRank" class="w-full bg-samurai-dark border border-samurai-border rounded-lg p-2.5 text-sm text-white focus:border-mayo-500 focus:outline-none">
                </div>

                <!-- Avatar Character Preset Buttons -->
                <div>
                    <label class="block text-xs font-bold text-mayo-300 mb-2">アバターアイコン文字</label>
                    <div class="grid grid-cols-5 gap-2" id="avatarPresets">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Save Profile Button -->
            <button onclick="saveUserProfile()" class="w-full bg-gradient-to-r from-mayo-500 to-mayo-600 hover:from-mayo-400 hover:to-mayo-500 text-samurai-dark font-black py-3 rounded-xl transition-all shadow-lg active:scale-98 flex items-center justify-center gap-2 text-sm">

                <span>設定を保存してローカルに反映</span>
            </button>

    <!-- FIREBASE SERVICES & REALTIME DATABASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // Specified Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA7vZoOms_DIZpXiIAbrHRRLoo1uQ2eDbA",
            authDomain: "mayo-empire-app.firebaseapp.com",
            databaseURL: "https://mayo-empire-app-default-rtdb.firebaseio.com",
            projectId: "mayo-empire-app",
            storageBucket: "mayo-empire-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.firebaseDb = db;
        window.pushRef = push;
        window.refDb = ref;

        // Initialize Realtime Listener for Active Channel
        let currentListenerRef = null;

        window.listenToChannel = function(channelId) {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = ''; // Clear existing DOM

            const messagesRef = ref(db, `channels/${channelId}/messages`);
            
            // Listen for newly added messages in realtime
            onChildAdded(messagesRef, (snapshot) => {
                const msg = snapshot.val();
                if (msg) {
                    window.appendMessageToUI(msg);
                }
            });

            document.getElementById('networkStatus').innerHTML = `<i class="fa-solid fa-wifi text-green-400"></i> Realtime Database 同期中 (#${channelId})`;
        };

        // Send Message Function using Realtime Database push
        window.sendMessageToFirebase = async function(channelId, messageData) {
            try {
                const messagesRef = ref(db, `channels/${channelId}/messages`);
                await push(messagesRef, messageData);
                window.playSquirtSound();

                // Check for bot trigger keywords
                window.checkBotResponseTrigger(channelId, messageData.text);
            } catch (err) {
                console.error("Firebase send error:", err);
                // Fallback for offline or invalid DB connection
                window.appendMessageToUI(messageData);
                window.checkBotResponseTrigger(channelId, messageData.text);
            }
        };

        // Initialize default channel listener
        window.listenToChannel(window.currentChannel || 'zatsudan');
    </script>

    <!-- UI & BUSINESS LOGIC SCRIPT -->
    <script>
        // APP CHANNELS DEFINITION
        const channels = {
            'zatsudan': { name: 'マヨラー雑談処', icon: 'fa-hashtag', desc: '帝国全兵員のリアルタイム雑談＆マヨネーズ愛の共有部屋' },
            'strategy': { name: '極秘・マヨ戦略会議', icon: 'fa-user-ninja', desc: 'マヨネーズ包囲網および全宇宙普及作戦会議室' },
            'development': { name: '新商品開発部', icon: 'fa-flask', desc: '飲めるマヨネーズ・ミントマヨなどの革新的新製品試作所' },
            'shinsengumi': { name: '銀魂・真選組駐屯地', icon: 'fa-shield-halved', desc: '真選組隊員専用・治安維持兼マヨネーズ補給拠点' }
        };

        // ONLINE MEMBERS LIST REQUIREMENT
        const empireMembers = [
            { name: '土方 十四郎', rank: '副長', avatar: '土', color: 'bg-red-700 text-white', status: 'オンライン', statusBg: 'bg-green-500' },
            { name: '沖田 総悟', rank: '一番隊組長', avatar: '沖', color: 'bg-red-900 text-white', status: 'オンライン', statusBg: 'bg-green-500' },
            { name: '近藤 勲', rank: '局長', avatar: '近', color: 'bg-yellow-700 text-white', status: '離席中', statusBg: 'bg-yellow-500' },
            { name: 'マヨ神', rank: '絶対神', avatar: '神', color: 'bg-amber-400 text-black font-black', status: '降臨中', statusBg: 'bg-purple-500 animate-pulse' },
            { name: 'エリザベス', rank: '謎のエリザベス', avatar: 'エ', color: 'bg-slate-200 text-black', status: 'オンライン', statusBg: 'bg-green-500' }
        ];

        // AVATAR PRESET LETTERS
        const avatarPresets = [
            { text: '覇', color: 'bg-yellow-500 text-black' },
            { text: '土', color: 'bg-red-700 text-white' },
            { text: '沖', color: 'bg-red-900 text-white' },
            { text: '近', color: 'bg-yellow-700 text-white' },
            { text: '神', color: 'bg-amber-400 text-black' },
            { text: '銀', color: 'bg-blue-600 text-white' },
            { text: '新', color: 'bg-sky-600 text-white' },
            { text: '桂', color: 'bg-indigo-700 text-white' },
            { text: 'エ', color: 'bg-slate-200 text-black' },
            { text: 'マ', color: 'bg-yellow-400 text-red-700 font-black' }
        ];

        // STATE INITIALIZATION FROM LOCALSTORAGE
        let currentChannel = 'zatsudan';
        window.currentChannel = currentChannel;
        let isAudioEnabled = true;

        let userProfile = JSON.parse(localStorage.getItem('mayo_user_profile')) || {
            name: 'マヨ大将',
            rank: '特命マヨ監察官',
            avatar: '覇',
            color: 'bg-yellow-500 text-black'
        };

        // SWITCH CHANNEL
        function switchChannel(key) {
            currentChannel = key;
            window.currentChannel = key;
            const ch = channels[key];
            
            document.getElementById('currentChannelTitle').textContent = ch.name;
            document.getElementById('currentChannelDesc').textContent = ch.desc;
            document.getElementById('channelHeaderIcon').className = `fa-solid ${ch.icon} text-mayo-400 text-lg shrink-0`;
            document.getElementById('chatInput').placeholder = `#${ch.name} へ送信...（キーワード：「マヨ」「土方」「沖田」等）`;

            renderChannels();
            playPopSound();

            if (window.listenToChannel) {
                window.listenToChannel(key);
            }
        }

        // RENDER CHANNELS LIST
        function renderChannels() {
            const container = document.getElementById('channelListContainer');
            container.innerHTML = '';

            Object.keys(channels).forEach(key => {
                const ch = channels[key];
                const isActive = key === currentChannel;
                
                const btn = document.createElement('button');
                btn.onclick = () => switchChannel(key);
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center justify-between group ${
                    isActive ? 'channel-active font-bold' : 'text-gray-400 hover:bg-samurai-hover hover:text-gray-200'
                }`;

                btn.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate">
                        <i class="fa-solid ${ch.icon} ${isActive ? 'text-mayo-400' : 'text-gray-500 group-hover:text-gray-300'} text-xs"></i>
                        <span class="truncate">${ch.name}</span>
                    </div>
                `;

                container.appendChild(btn);
            });
        }

        // RENDER MEMBER ROSTER
        function renderMembers() {
            const container = document.getElementById('memberList');
            container.innerHTML = '';

            empireMembers.forEach(m => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2.5 p-2 rounded-xl hover:bg-samurai-hover transition-all cursor-pointer';
                div.onclick = () => insertQuickText(`@${m.name} `);
                div.innerHTML = `
                    <div class="relative shrink-0">
                        <div class="w-8 h-8 rounded-full ${m.color} flex items-center justify-center font-bold text-xs border border-white/20 shadow">
                            ${m.avatar}
                        </div>
                        <span class="w-2.5 h-2.5 ${m.statusBg} rounded-full absolute bottom-0 right-0 border border-samurai-dark"></span>
                    </div>
                    <div class="overflow-hidden flex-1">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-white truncate text-xs">${escapeHtml(m.name)}</span>
                        </div>
                        <div class="text-[10px] text-mayo-400 truncate">${escapeHtml(m.rank)} ｜ <span class="text-gray-400">${m.status}</span></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // APPEND MESSAGE TO CHAT UI
        window.appendMessageToUI = function(msg) {
            const container = document.getElementById('chatContainer');
            
            // Remove initial spinner if present
            if (container.querySelector('.fa-spinner')) {
                container.innerHTML = '';
            }

            const isUser = msg.sender === userProfile.name;
            const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgEl = document.createElement('div');
            msgEl.className = `flex items-start gap-3 group ${isUser ? 'bg-mayo-500/5 -mx-4 px-4 py-2 rounded-xl border-l-2 border-mayo-500' : 'py-1'}`;

            msgEl.innerHTML = `
                <div class="w-9 h-9 rounded-full ${msg.color || 'bg-yellow-600'} flex items-center justify-center font-bold text-white text-sm shrink-0 border border-white/20 shadow mt-0.5">
                    ${escapeHtml(msg.avatar || '覇')}
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="flex items-baseline gap-2">
                        <span class="font-bold text-sm ${isUser ? 'text-mayo-300' : 'text-white'} font-maru">${escapeHtml(msg.sender)}</span>
                        ${msg.rank ? `<span class="text-[10px] text-mayo-400 bg-black/40 px-1.5 py-0.2 rounded font-mono">${escapeHtml(msg.rank)}</span>` : ''}
                        <span class="text-[10px] text-gray-500 font-mono">${timeStr}</span>
                    </div>
                    <p class="text-sm text-gray-200 mt-0.5 leading-relaxed break-words font-sans">${escapeHtml(msg.text)}</p>
                </div>
            `;

            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        };

        // FORM SUBMIT HANDLER
        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const messageData = {
                sender: userProfile.name,
                rank: userProfile.rank,
                avatar: userProfile.avatar,
                color: userProfile.color,
                text: text,
                timestamp: Date.now()
            };

            input.value = '';

            if (window.sendMessageToFirebase) {
                window.sendMessageToFirebase(currentChannel, messageData);
            }
        }

        // AUTOMATED BOT RESPONSES GIMMICK
        window.checkBotResponseTrigger = function(channelId, text) {
            let botReply = null;

            if (text.includes('マヨ')) {
                botReply = {
                    sender: '土方 十四郎',
                    rank: '副長',
                    avatar: '土',
                    color: 'bg-red-700 text-white',
                    text: 'そうだ、マヨネーズこそが宇宙の絶対真理だ。一口食べるごとに感謝を捧げろ！ #マヨネーズ最高',
                    timestamp: Date.now()
                };
            } else if (text.includes('土方')) {
                botReply = {
                    sender: '沖田 総悟',
                    rank: '一番隊組長',
                    avatar: '沖',
                    color: 'bg-red-900 text-white',
                    text: '土方さんの後頭部にバズーカの照準を固定完了しやした。いつでも撃てますぜ。',
                    timestamp: Date.now()
                };
            } else if (text.includes('沖田')) {
                botReply = {
                    sender: '土方 十四郎',
                    rank: '副長',
                    avatar: '土',
                    color: 'bg-red-700 text-white',
                    text: '総悟！また俺の命を狙ってんのか！切腹させるぞコラ！',
                    timestamp: Date.now()
                };
            } else if (text.includes('近藤')) {
                botReply = {
                    sender: '近藤 勲',
                    rank: '局長',
                    avatar: '近',
                    color: 'bg-yellow-700 text-white',
                    text: 'おーいみんな！おたえさんはどこだー！愛の力でマヨネーズ帝国を支えるぞ！',
                    timestamp: Date.now()
                };
            } else if (text.includes('挨拶') || text.includes('こんにちは') || text.includes('コンニチハ')) {
                botReply = {
                    sender: 'エリザベス',
                    rank: '謎のエリザベス',
                    avatar: 'エ',
                    color: 'bg-slate-200 text-black',
                    text: '【プラカード】「大マヨネーズ帝国へようこそ！本日も全速前進！」',
                    timestamp: Date.now()
                };
            }

            if (botReply) {
                setTimeout(() => {
                    if (window.sendMessageToFirebase) {
                        window.sendMessageToFirebase(channelId, botReply);
                    }
                }, 1500); // 1.5s delay
            }
        };

        // PROFILE MODAL FUNCTIONS
        function renderAvatarPresets() {
            const container = document.getElementById('avatarPresets');
            container.innerHTML = '';

            avatarPresets.forEach(p => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => selectAvatarPreset(p);
                btn.className = `w-10 h-10 rounded-full ${p.color} font-bold text-xs flex items-center justify-center border-2 border-transparent hover:border-white transition-all shadow`;
                btn.textContent = p.text;
                container.appendChild(btn);
            });
        }

        function selectAvatarPreset(preset) {
            userProfile.avatar = preset.text;
            userProfile.color = preset.color;
            updateUserUi();
            playPopSound();
        }

        function saveUserProfile() {
            const nameInput = document.getElementById('inputUserName').value.trim();
            const rankInput = document.getElementById('inputUserRank').value.trim();

            if (nameInput) userProfile.name = nameInput;
            if (rankInput) userProfile.rank = rankInput;

            localStorage.setItem('mayo_user_profile', JSON.stringify(userProfile));
            updateUserUi();
            toggleCitizenCardModal();
            playSlashSound();
        }

        function updateUserUi() {
            document.getElementById('userDisplayName').textContent = userProfile.name;
            document.getElementById('sidebarUserRank').textContent = userProfile.rank;
            
            const avatarEl = document.getElementById('sidebarAvatar');
            avatarEl.className = `w-9 h-9 rounded-full ${userProfile.color} flex items-center justify-center font-bold shadow border border-white/40`;
            avatarEl.textContent = userProfile.avatar;
        }

        function toggleCitizenCardModal() {
            const modal = document.getElementById('citizenModal');
            modal.classList.toggle('hidden');

            document.getElementById('inputUserName').value = userProfile.name;
            document.getElementById('inputUserRank').value = userProfile.rank;

            playPopSound();
        }

        // QUICK HELPERS
        function insertQuickText(text) {
            const input = document.getElementById('chatInput');
            input.value += ` ${text} `;
            input.focus();
        }

        function insertMayoEmoji() {
            insertQuickText('🧴(マヨ)');
        }

        function toggleMemberList() {
            const sidebar = document.getElementById('memberSidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('flex');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // WEB AUDIO SOUND EFFECTS
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const icon = document.getElementById('audioIcon');
            icon.className = isAudioEnabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm';
            if (isAudioEnabled) playSquirtSound();
        }

        function playSquirtSound() {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
            } catch(e){}
        }

        function playPopSound() {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e){}
        }

        function playSlashSound() {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e){}
        }

        // ON LOAD INITIALIZATION
        window.onload = function() {
            renderChannels();
            renderMembers();
            renderAvatarPresets();
            updateUserUi();
        };
    </script>
</body>
</html>
