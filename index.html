    <!-- Application Logic -->
    <script>
        // --- 1. CONFIG & SYSTEM STATE ---
        const GEMINI_API_KEY = "AQ.Ab8RN6I4tcKZt-m4A0dSE8d4obcaq3ysP5UMRF6V3puJKC0Www";
        let currentChannel = 'general';
        let selectedMedia = null; // Stores attached base64 media

        // User State (Local Storage persistent)
        let currentUser = {
            id: 'user_' + Math.random().toString(36).substr(2, 9),
            name: localStorage.getItem('mayo_user_name') || 'オーガポン',
            avatar: localStorage.getItem('mayo_user_avatar') || '霸',
            role: localStorage.getItem('mayo_user_role') || '特命マヨ監察官'
        };

        // Character Prompts (銀魂キャラクター設定)
        const CHARACTER_PROMPTS = {
            "土方": `あなたは「銀魂」の土方十四郎です。マヨネーズをこよなく愛する真選組副長。「〜だろーが」「〜じゃねえよ」「マヨネーズが足りねえ」といった口調で話します。厳格でツンデレ気質、マヨネーズに関する話題には超情熱的になります。簡潔に1〜3文で返答してください。`,
            "銀時": `あなたは「銀魂」の坂田銀時です。万事屋のリーダーで無気力な甘党。「〜だろ」「〜じゃねーか」「いちご牛乳」などの言葉を使います。普段はやる気がないですが情に厚く、ユーモアたっぷりにボケたりツッコミを入れたりします。簡潔に1〜3文で返答してください。`,
            "沖田": `あなたは「銀魂」の沖田総悟です。真選組一番隊隊長で腹黒ドS。「〜でさァ」「〜ですぜ」という江戸っ子口調で話します。土方副長を蹴落とそうとする言動やドSな発言を爽やかにかまします。簡潔に1〜3文で返答してください。`,
            "神楽": `あなたは「銀魂」の神楽です。万事屋のヒロインで夜兎族の少女。「〜アル」「〜ネ」「〜ヨ」という語尾を使って話します。口が悪く大食いで自由奔放、酢昆布が大好物です。簡潔に1〜3文で返答してください。`
        };

        // --- 2. INITIALIZATION ---
        window.onload = function() {
            updateUserUIDisplay();
            renderInitialMessages();
        };

        function updateUserUIDisplay() {
            document.getElementById('userNameDisplay').textContent = currentUser.name;
            document.getElementById('userRoleDisplay').textContent = currentUser.role;
            document.getElementById('userAvatarBadge').textContent = currentUser.avatar;
            document.getElementById('onlineMyName').textContent = currentUser.name + ' (あなた)';
            document.getElementById('onlineMyAvatar').textContent = currentUser.avatar;
        }

        // --- 3. CHANNEL SWITCHING ---
        function switchChannel(channelId, titleText) {
            currentChannel = channelId;
            document.getElementById('currentChannelTitle').textContent = titleText;
            
            // Highlight active button
            document.querySelectorAll('.channel-btn').forEach(btn => {
                if (btn.dataset.channel === channelId) {
                    btn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-mayo-500/10 text-mayo-300 font-medium text-sm border border-mayo-500/30 transition-all channel-btn text-left";
                    btn.querySelector('i').className = "fa-solid fa-hashtag text-mayo-400";
                } else {
                    btn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-samurai-hover hover:text-slate-200 font-medium text-sm transition-all channel-btn text-left";
                    btn.querySelector('i').className = "fa-solid fa-hashtag text-slate-500";
                }
            });

            renderInitialMessages();
        }

        // --- 4. MESSAGE RENDERING ---
        const dummyMessages = {
            general: [
                { id: '1', sender: '土方十四郎', avatar: '土', role: 'マヨネーズ最高指導者', content: 'おい全員聴け！今日から全ての食事にマヨネーズをチューブ1本追加することが義務付けられた！異論は認めん！', time: '10:15', isAi: true, color: 'bg-red-600' },
                { id: '2', sender: '坂田銀時', avatar: '銀', role: '万事屋参謀', content: 'おいおいマヨラー副長、朝から胃もたれするような発言やめてくんねーかな。時代はイチゴパフェなんだよイチゴパフェ。', time: '10:16', isAi: true, color: 'bg-sky-600' }
            ],
            yorozuya: [
                { id: '1', sender: '神楽', avatar: '神', role: '夜兎族アタッカー', content: '銀ちゃん！今日のおやつは酢昆布マシマシで頼むアル！', time: '09:30', isAi: true, color: 'bg-orange-600' }
            ],
            engawa: [
                { id: '1', sender: '沖田総悟', avatar: '沖', role: 'サディスティック隊長', content: '土方さん、バズーカの狙撃演習の的にマヨネーズボトル置いておきましたぜ。', time: '11:00', isAi: true, color: 'bg-amber-600' }
            ],
            shinsengumi: [
                { id: '1', sender: '土方十四郎', avatar: '土', role: '副長', content: '局中法度追加！マヨネーズを残した者は切腹！！', time: '08:00', isAi: true, color: 'bg-red-600' }
            ]
        };

        function renderInitialMessages() {
            const stream = document.getElementById('chatStream');
            stream.innerHTML = '';

            const list = dummyMessages[currentChannel] || [];
            list.forEach(msg => appendMessageUI(msg));
            stream.scrollTop = stream.scrollHeight;
        }

        function appendMessageUI(msg) {
            const stream = document.getElementById('chatStream');
            const isMe = msg.sender === currentUser.name;
            
            const msgEl = document.createElement('div');
            msgEl.className = `flex space-x-3 ${isMe ? 'flex-row-reverse space-x-reverse' : ''} items-start`;

            let avatarBg = msg.color || 'bg-mayo-500 text-slate-950 font-bold';
            
            let mediaContent = '';
            if (msg.media) {
                if (msg.media.type.startsWith('image/')) {
                    mediaContent = `<div class="mt-2 rounded-lg overflow-hidden max-w-xs border border-samurai-border">
                        <img src="${msg.media.url}" class="w-full h-auto object-cover max-h-60" />
                    </div>`;
                } else if (msg.media.type.startsWith('audio/')) {
                    mediaContent = `<div class="mt-2">
                        <audio controls src="${msg.media.url}" class="max-w-xs"></audio>
                    </div>`;
                } else {
                    mediaContent = `<div class="mt-2 p-2 bg-samurai-dark rounded border border-samurai-border flex items-center space-x-2 text-xs">
                        <i class="fa-solid fa-file-arrow-down text-mayo-400"></i>
                        <a href="${msg.media.url}" download="${msg.media.name}" class="text-mayo-300 underline truncate max-w-xs">${msg.media.name}</a>
                    </div>`;
                }
            }

            msgEl.innerHTML = `
                <div class="w-9 h-9 rounded-lg ${avatarBg} font-bold flex items-center justify-center text-sm shadow shrink-0">
                    ${msg.avatar}
                </div>
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[80%]">
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="text-xs font-bold ${msg.isAi ? 'text-mayo-400' : 'text-slate-300'}">${msg.sender}</span>
                        <span class="text-[10px] text-slate-500">${msg.time}</span>
                    </div>
                    <div class="p-3 rounded-xl text-sm ${isMe ? 'bg-mayo-500 text-slate-950 font-medium' : 'bg-samurai-cardBg text-slate-100 border border-samurai-border'} shadow-md">
                        <p class="whitespace-pre-wrap">${escapeHtml(msg.content)}</p>
                        ${mediaContent}
                    </div>
                </div>
            `;
            
            stream.appendChild(msgEl);
            stream.scrollTop = stream.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // --- 5. MEDIA ATTACHMENT HANDLERS ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedMedia = {
                    name: file.name,
                    type: file.type,
                    url: e.target.result
                };
                
                document.getElementById('mediaFileName').textContent = file.name;
                document.getElementById('mediaPreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearMediaAttachment() {
            selectedMedia = null;
            document.getElementById('mediaInput').value = '';
            document.getElementById('mediaPreviewContainer').classList.add('hidden');
        }

        // --- 6. SEND MESSAGE & GEMINI AI TRIGGER ---
        async function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !selectedMedia) return;

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const userMsg = {
                id: Date.now().toString(),
                sender: currentUser.name,
                avatar: currentUser.avatar,
                role: currentUser.role,
                content: text,
                time: timeNow,
                isAi: false,
                media: selectedMedia ? { ...selectedMedia } : null
            };

            // Push message to active channel list & UI
            if (!dummyMessages[currentChannel]) dummyMessages[currentChannel] = [];
            dummyMessages[currentChannel].push(userMsg);
            appendMessageUI(userMsg);

            // Clear Input
            input.value = '';
            clearMediaAttachment();

            // Check for AI Characters Trigger
            checkAndTriggerAI(text);
        }

        async function checkAndTriggerAI(text) {
            const targets = [
                { key: '土方', name: '土方十四郎', avatar: '土', role: 'マヨネーズ最高指導者', color: 'bg-red-600' },
                { key: '銀時', name: '坂田銀時', avatar: '銀', role: '万事屋参謀', color: 'bg-sky-600' },
                { key: '沖田', name: '沖田総悟', avatar: '沖', role: 'サディスティック隊長', color: 'bg-amber-600' },
                { key: '神楽', name: '神楽', avatar: '神', role: '夜兎族アタッカー', color: 'bg-orange-600' }
            ];

            for (const char of targets) {
                if (text.includes(char.key) || text.includes(`@${char.key}`)) {
                    // Call Gemini API
                    fetchGeminiReply(char, text);
                }
            }
        }

        async function fetchGeminiReply(character, userPrompt) {
            const systemPrompt = CHARACTER_PROMPTS[character.key] || "語尾にマヨをつけて話してください。";

            try {
                // Call Google Gemini API with specified Key
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: 'user',
                                parts: [{ text: `${systemPrompt}\n\nユーザーの発言: "${userPrompt}"` }]
                            }
                        ]
                    })
                });

                const data = await response.json();
                let aiReplyText = "";

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    aiReplyText = data.candidates[0].content.parts[0].text;
                } else {
                    aiReplyText = "……（通信の乱れで返答が聞き取れなかったマヨ）";
                }

                const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const aiMsg = {
                    id: Date.now().toString(),
                    sender: character.name,
                    avatar: character.avatar,
                    role: character.role,
                    content: aiReplyText,
                    time: timeNow,
                    isAi: true,
                    color: character.color
                };

                dummyMessages[currentChannel].push(aiMsg);
                appendMessageUI(aiMsg);

            } catch (error) {
                console.error("Gemini API Error:", error);
                const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const errorMsg = {
                    id: Date.now().toString(),
                    sender: character.name,
                    avatar: character.avatar,
                    role: character.role,
                    content: "……（通信エラーで返答が遮断されたようだ）",
                    time: timeNow,
                    isAi: true,
                    color: character.color
                };
                appendMessageUI(errorMsg);
            }
        }

        // --- 7. MODAL & PROFILE UPDATE ---
        function toggleProfileModal() {
            const modal = document.getElementById('profileModal');
            document.getElementById('inputProfileName').value = currentUser.name;
            document.getElementById('inputProfileAvatar').value = currentUser.avatar;
            document.getElementById('inputProfileRole').value = currentUser.role;
            modal.classList.toggle('hidden');
        }

        function saveProfile() {
            const name = document.getElementById('inputProfileName').value.trim();
            const avatar = document.getElementById('inputProfileAvatar').value.trim();
            const role = document.getElementById('inputProfileRole').value.trim();

            if (name) currentUser.name = name;
            if (avatar) currentUser.avatar = avatar;
            if (role) currentUser.role = role;

            localStorage.setItem('mayo_user_name', currentUser.name);
            localStorage.setItem('mayo_user_avatar', currentUser.avatar);
            localStorage.setItem('mayo_user_role', currentUser.role);

            updateUserUIDisplay();
            toggleProfileModal();
        }
    </script>
</body>
</html>
